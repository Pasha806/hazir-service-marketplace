name: projects
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  url_launcher: ^6.3.0
  # --- Firebase ---
  firebase_core: ^2.24.2
  firebase_auth: ^4.20.0
  cloud_firestore: ^4.17.5
  firebase_storage: ^11.7.7

  # --- Sign-in / Media / Utils ---
  google_sign_in: ^6.2.1
  image_picker: ^1.1.2
  intl: ^0.19.0
  share_plus: ^10.0.0
  provider: ^6.0.5

  # --- Location & Google Maps ---
  geolocator: ^11.0.0
  google_maps_flutter: ^2.6.0
  flutter_polyline_points: ^2.0.0

  # ✅ Google Places wrapper (downgraded per solver hint)
  flutter_google_places_sdk: ^0.3.3

  # Optional: reverse-geocoding helpers
  geocoding: ^2.1.1

  # (Optional) OSM stack from earlier — safe to remove if not needed
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  http: ^1.2.2

  # Storage / prefs
  shared_preferences: ^2.2.3

  # iOS style icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1  # Add this line

flutter:
  uses-material-design: true
  assets:
    - assets/images/


flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path:  "assets/images/APPICON.png"
  min_sdk_android: 21 # Since your minSdk is 21

